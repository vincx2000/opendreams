[project]
name = "library_api"
version = "0.1.0"
description = "Eval fixture: a small layered FastAPI library-lending service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic[email]>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
