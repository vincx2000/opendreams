[project]
name = "opendream"
version = "0.0.1"
description = "Memory consolidation for AI agents — works with any model, any framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vincent Gomes" }]
keywords = ["ai", "agents", "memory", "llm", "aider", "openhands"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.6",
    "openai>=1.30",
    "sqlite-vec>=0.1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
opendream = "opendream.cli:app"

[project.urls]
Homepage = "https://github.com/YOURNAME/opendream"
Issues = "https://github.com/YOURNAME/opendream/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
