[project]
name = "opendream"
version = "0.0.2"
description = "Memory consolidation for AI agents — works with any model, any framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vincent Gomes" }]
keywords = [
    "ai", "agents", "memory", "llm", "claude-code", "aider",
    "openhands", "agents-md", "agent-memory", "prompt-engineering",
    "anthropic", "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.6",
    "openai>=1.30",
    "anthropic>=0.40",
    "sqlite-vec>=0.1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Eval-only deps: required by eval/fixtures/library_api/ (the FastAPI codebase
# under test by `opendream eval run`). Not in main `dependencies` because §5
# caps runtime deps at 6 — the fixture is testing-only, not shipped runtime.
eval = [
    "fastapi>=0.110",
    "pydantic[email]>=2.6",
    "httpx>=0.27",
]

[project.scripts]
opendream = "opendream.cli:app"

[project.urls]
Homepage = "https://github.com/vincx2000/opendreams"
Issues = "https://github.com/vincx2000/opendreams/issues"
Source = "https://github.com/vincx2000/opendreams"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true   # sqlite-vec ships no py.typed marker
exclude = [
    "eval/tasks/",       # per-task test fixtures (duplicate test_* module names)
    "eval/fixtures/",    # the codebase-under-test for the eval suite
]
